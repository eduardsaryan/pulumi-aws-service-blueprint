name: preview

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - run: npm install --prefix policy
      - run: npx tsc --noEmit
        working-directory: policy

  preview:
    needs: check
    # Skipped until the repository variables from ci/README.md are set
    if: vars.AWS_PREVIEW_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      STACK: ${{ vars.PULUMI_STACK || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm install --prefix policy
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PREVIEW_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: pulumi/actions@v6
      - run: pulumi stack select "$STACK" --create
      - run: pulumi preview --diff --policy-pack policy
